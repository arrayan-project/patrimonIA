name: patrimonia-db

services:
  postgres:
    image: postgres:16
    container_name: patrimonia-postgres
    # Vuelve a levantar sola tras reiniciar el laptop (hasta un `docker compose stop`).
    restart: unless-stopped
    environment:
      POSTGRES_USER: patrimonia
      POSTGRES_PASSWORD: patrimonia
      POSTGRES_DB: patrimonia
    ports:
      - "5432:5432"
    volumes:
      # Volumen EXTERNO (creado a mano una vez): `docker compose down -v` NO lo
      # borra. Crearlo la primera vez con:  docker volume create patrimonia_pgdata
      - patrimonia_pgdata:/var/lib/postgresql/data
      # init/ se ejecuta solo cuando el volumen está vacío (primer arranque):
      #   00_test_db.sql   → CREATE DATABASE patrimonia_test
      #   01_schema.sql    → esquema en patrimonia
      #   02_test_schema.sh→ esquema en patrimonia_test
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrimonia -d patrimonia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  patrimonia_pgdata:
    external: true
    name: patrimonia_pgdata

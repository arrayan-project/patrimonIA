name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patrimonia
          POSTGRES_PASSWORD: patrimonia
          POSTGRES_DB: patrimonia
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://patrimonia:patrimonia@localhost:5432/patrimonia?schema=public
      JWT_SECRET: ci-secret-no-produccion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: api/.nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Cargar el esquema (patrimonia + patrimonia_test)
        run: |
          # psql (libpq) no entiende "?schema=public" — es una extensión propia
          # de Prisma en DATABASE_URL. Se usa una URL "limpia" solo para psql;
          # DATABASE_URL sigue intacta para los pasos de Prisma más abajo.
          PSQL_URL="postgresql://patrimonia:patrimonia@localhost:5432/patrimonia"
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f db/init/01_schema.sql
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE patrimonia_test"
          psql "postgresql://patrimonia:patrimonia@localhost:5432/patrimonia_test" -v ON_ERROR_STOP=1 -f db/init/01_schema.sql
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx expo export --platform web
        env:
          EXPO_NO_TELEMETRY: '1'

# Render Blueprint — backend NestJS de PatrimonIA.
# New → Blueprint en render.com, apuntar a este repo. Ver Docs/DESPLIEGUE.md.
services:
  - type: web
    name: patrimonia-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false # connection string de Neon, con ?sslmode=require
      - key: JWT_SECRET
        sync: false # generar uno nuevo — NO reusar el de desarrollo
      - key: AUTH_REGISTRO_TOKEN_REQUERIDO
        value: "false"
